<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesos 26-27</title>
    <link rel="stylesheet" href="shared/colores.css">
    <link rel="stylesheet" href="shared/pagina.css">
    <link rel="stylesheet" href="shared/dialogo.css">
    <link rel="stylesheet" href="shared/formulario.css">
    <link rel="stylesheet" href="shared/usuarios.css">
    <link rel="stylesheet" href="shared/avisos.css">
</head>
<body>
    <div class="escena">
        <div class="herramientas">
            <button id="botonTema" type="button" data-etiqueta="cambiarTema" aria-label="Cambiar tema">
                <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                    <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.8 4.8l1.6 1.6M17.6 17.6l1.6 1.6M19.2 4.8l-1.6 1.6M6.4 17.6l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                </svg>
                <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.5 3.5a8.2 8.2 0 1 0 5 12.2A7 7 0 0 1 15.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                </svg>
            </button>
            <button id="botonIdioma" type="button" data-etiqueta="cambiarIdioma" aria-label="Cambiar idioma">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                    <path d="M7 9h6M10 9c0 3-2.2 5-5 6M8 12.5c1.2 1.4 2.6 2.3 4.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                    <path d="M14 16l2.2-6 2.2 6M14.7 14.2h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span data-texto="codigo">ES</span>
            </button>
        </div>
        <p id="mensaje" role="status" hidden></p>

        <main class="panel">
            <img class="logo" src="img/logo-perfil.webp" alt="Universidad de Castilla-La Mancha">

            <section id="vistaInicioSesion" class="tarjeta" hidden>
                <h1 data-texto="login">Login</h1>
                <form id="formularioInicioSesion">
                    <label class="campo">
                        <span data-texto="email">Email</span>
                        <span class="linea">
                            <input name="email" type="email" required autocomplete="email">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </label>
                    <label class="campo">
                        <span data-texto="contrasena">Contraseña</span>
                        <span class="linea">
                            <input name="contrasena" type="password" required autocomplete="current-password">
                            <button class="ver-contrasena" type="button" data-etiqueta="verContrasena" aria-label="Mostrar contraseña">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 20l3.2-.6L19 7.6 16.4 5 4.6 16.8 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                    <path d="M13.8 7.6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                                </svg>
                            </button>
                        </span>
                    </label>
                    <div class="fila-opciones">
                        <label class="recordar">
                            <input id="recordarme" name="recordarme" type="checkbox">
                            <span data-texto="recordarme">Recuerdame</span>
                        </label>
                        <p class="olvido">
                            <span data-texto="olvidaste">¿Olvidaste la contraseña?</span>
                            <a href="#" id="enlaceRecuperar" data-texto="recuperar">Recuperar</a>
                        </p>
                    </div>
                    <button class="boton-entrar" type="submit" data-texto="entrar">Entrar</button>
                    <div class="pie-tarjeta">
                        <p>
                            <span data-texto="noRegistrado">¿No estas registrado aún?</span>
                            <a href="#" id="enlaceRegistro" data-texto="creaCuenta">Crea una cuenta</a>
                        </p>
                        <button id="botonVozLogin" class="micro" type="button" data-etiqueta="dictar" aria-label="Dictar">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                <path d="M6 11a6 6 0 0 0 12 0M12 17v3M9 20h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </section>

            <section id="vistaRegistro" class="tarjeta" hidden>
                <h1 data-texto="registro">Registro</h1>
                <form id="formularioRegistro">
                    <label class="campo">
                        <span data-texto="email">Email</span>
                        <span class="linea">
                            <input name="email" type="email" required autocomplete="email">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </label>
                    <label class="campo">
                        <span data-texto="nick">Nick</span>
                        <span class="linea">
                            <input name="nick" type="text" required maxlength="30" autocomplete="nickname">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                                <path d="M5.5 19c1.2-3 3.4-4.5 6.5-4.5s5.3 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            </svg>
                        </span>
                    </label>
                    <label class="campo">
                        <span data-texto="contrasena">Contraseña</span>
                        <span class="linea">
                            <input name="contrasena" type="password" required minlength="8" maxlength="64" autocomplete="new-password">
                            <button class="ver-contrasena" type="button" data-etiqueta="verContrasena" aria-label="Mostrar contraseña">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 20l3.2-.6L19 7.6 16.4 5 4.6 16.8 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                    <path d="M13.8 7.6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                                </svg>
                            </button>
                        </span>
                    </label>
                    <button class="enviar" type="submit" data-texto="crearCuenta">Crear cuenta</button>
                    <div class="pie-tarjeta">
                        <p>
                            <span data-texto="yaTienes">¿Ya tienes cuenta?</span>
                            <a href="#" id="enlaceInicioSesion" data-texto="iniciaSesion">Inicia sesión</a>
                        </p>
                        <button id="botonVozRegistro" class="micro" type="button" data-etiqueta="dictar" aria-label="Dictar">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                <path d="M6 11a6 6 0 0 0 12 0M12 17v3M9 20h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </section>

            <section id="vistaRecuperacion" class="tarjeta" hidden>
                <form id="formularioRecuperacion">
                    <h1 data-texto="recuperarTitulo">Recuperar contraseña</h1>
                    <label class="campo">
                        <span data-texto="email">Email</span>
                        <span class="linea">
                            <input name="email" type="email" required autocomplete="email">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </label>
                    <button class="boton-entrar" type="submit" data-texto="continuar">Continuar</button>
                    <div class="pie-tarjeta">
                        <p>
                            <a href="#" id="enlaceVolverInicio" data-texto="volverInicio">Volver al inicio</a>
                        </p>
                    </div>
                </form>
                <form id="formularioNuevaContrasena" hidden>
                    <h1 data-texto="nuevaContrasenaTitulo">Nueva contraseña</h1>
                    <label class="campo">
                        <span data-texto="nuevaContrasena">Nueva contraseña</span>
                        <span class="linea">
                            <input name="contrasena" type="password" required minlength="8" maxlength="64" autocomplete="new-password">
                            <button class="ver-contrasena" type="button" data-etiqueta="verContrasena" aria-label="Mostrar contraseña">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 20l3.2-.6L19 7.6 16.4 5 4.6 16.8 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                    <path d="M13.8 7.6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                                </svg>
                            </button>
                        </span>
                    </label>
                    <label class="campo">
                        <span data-texto="confirmarContrasena">Repite la contraseña</span>
                        <span class="linea">
                            <input name="confirmar" type="password" required minlength="8" maxlength="64" autocomplete="new-password">
                            <button class="ver-contrasena" type="button" data-etiqueta="verContrasena" aria-label="Mostrar contraseña">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 20l3.2-.6L19 7.6 16.4 5 4.6 16.8 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                    <path d="M13.8 7.6l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                                </svg>
                            </button>
                        </span>
                    </label>
                    <button class="boton-entrar" type="submit" data-texto="guardarContrasena">Guardar contraseña</button>
                    <div class="pie-tarjeta">
                        <p>
                            <a href="#" id="enlaceCancelarRecuperacion" data-texto="volverInicio">Volver al inicio</a>
                        </p>
                    </div>
                </form>
            </section>

            <section id="vistaUsuarios" class="tarjeta" hidden>
                <h1><span data-texto="usuarios">Usuarios</span> (<span id="numeroUsuarios">0</span>)</h1>
                <p class="sesion-actual">
                    <span id="usuarioActual"></span>
                    <button id="botonCerrarSesion" type="button" data-texto="cerrarSesion">Cerrar sesión</button>
                </p>
                <button id="botonRefrescar" class="enviar" type="button" data-texto="refrescar">Refrescar</button>
                <ul id="listaUsuarios"></ul>
            </section>

        </main>
    </div>

    <script src="js/comunicacion/errorApi.js"></script>
    <script src="js/comunicacion/clienteHttp.js"></script>
    <script src="js/comunicacion/clienteRest.js"></script>
    <script src="shared/textosInterfaz.js"></script>
    <script src="js/presentacion/dictadoVoz.js"></script>
    <script src="js/presentacion/vistas/vistaBarraHerramientas.js"></script>
    <script src="js/presentacion/vistas/vistaCabecera.js"></script>
    <script src="js/presentacion/vistas/vistaInicioSesion.js"></script>
    <script src="js/presentacion/vistas/vistaRegistro.js"></script>
    <script src="js/presentacion/vistas/vistaRecuperacion.js"></script>
    <script src="js/presentacion/vistas/vistaUsuarios.js"></script>
    <script src="js/presentacion/controlWeb.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
